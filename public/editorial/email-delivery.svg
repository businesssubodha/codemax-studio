<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" rx="28" fill="#f4f2eb"/><text x="60" y="66" font-family="Arial,sans-serif" font-size="22" fill="#52564e" letter-spacing="3">CODEMAX / BUSINESS WEBSITES</text><text x="60" y="136" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#151914">Where did the enquiry stop?</text><rect x="60" y="185" width="528" height="188" rx="18" fill="#d7fb75"/><text x="86" y="236" font-family="Arial,sans-serif" font-size="22" fill="#545b4d">01</text><text x="86" y="284" font-family="Arial,sans-serif" font-weight="700" font-size="32" fill="#151914">BROWSER</text><text x="86" y="328" font-family="Arial,sans-serif" font-size="25" fill="#353d2c">Did the request leave the form?</text><rect x="612" y="185" width="528" height="188" rx="18" fill="#ffffff"/><text x="638" y="236" font-family="Arial,sans-serif" font-size="22" fill="#545b4d">02</text><text x="638" y="284" font-family="Arial,sans-serif" font-weight="700" font-size="32" fill="#151914">SERVER</text><text x="638" y="328" font-family="Arial,sans-serif" font-size="25" fill="#353d2c">Was the request accepted?</text><rect x="60" y="397" width="528" height="188" rx="18" fill="#ffffff"/><text x="86" y="448" font-family="Arial,sans-serif" font-size="22" fill="#545b4d">03</text><text x="86" y="496" font-family="Arial,sans-serif" font-weight="700" font-size="32" fill="#151914">SENDER</text><text x="86" y="540" font-family="Arial,sans-serif" font-size="25" fill="#353d2c">What does the delivery log say?</text><rect x="612" y="397" width="528" height="188" rx="18" fill="#ffffff"/><text x="638" y="448" font-family="Arial,sans-serif" font-size="22" fill="#545b4d">04</text><text x="638" y="496" font-family="Arial,sans-serif" font-weight="700" font-size="32" fill="#151914">INBOX</text><text x="638" y="540" font-family="Arial,sans-serif" font-size="25" fill="#353d2c">Did the recipient receive it?</text><text x="60" y="681" font-family="Arial,sans-serif" font-size="25" fill="#151914">A success message alone does not prove inbox delivery.</text></svg>