<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title"><title id="title">Four questions for an AI claim</title><rect width="1200" height="760" fill="#f7f6f2"/><rect x="0" y="0" width="1200" height="16" fill="#ff4b19"/><text x="64" y="85" font-family="Arial,sans-serif" font-size="20" fill="#bd3514" letter-spacing="3">CODEMAX / AI INSIGHTS</text><text x="64" y="151" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#20231f">Four questions for an AI claim</text><rect x="64" y="207" width="520" height="204" rx="18" fill="#20231f"/><circle cx="107" cy="250" r="20" fill="#ff4b19"/><text x="107" y="257" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#151513">1</text><text x="92" y="313" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#f7f6f2">TASK</text><text x="92" y="360" font-family="Arial,sans-serif" font-size="22" fill="#e0dfd7">What was the system asked to do?</text><rect x="616" y="207" width="520" height="204" rx="18" fill="#20231f"/><circle cx="659" cy="250" r="20" fill="#ff4b19"/><text x="659" y="257" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#151513">2</text><text x="644" y="313" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#f7f6f2">EVIDENCE</text><text x="644" y="360" font-family="Arial,sans-serif" font-size="22" fill="#e0dfd7">What supports the result?</text><rect x="64" y="441" width="520" height="204" rx="18" fill="#20231f"/><circle cx="107" cy="484" r="20" fill="#ff4b19"/><text x="107" y="491" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#151513">3</text><text x="92" y="547" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#f7f6f2">CONDITIONS</text><text x="92" y="594" font-family="Arial,sans-serif" font-size="22" fill="#e0dfd7">Which tools and help were used?</text><rect x="616" y="441" width="520" height="204" rx="18" fill="#20231f"/><circle cx="659" cy="484" r="20" fill="#ff4b19"/><text x="659" y="491" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#151513">4</text><text x="644" y="547" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#f7f6f2">LIMITS</text><text x="644" y="594" font-family="Arial,sans-serif" font-size="22" fill="#e0dfd7">What has not been established?</text><text x="64" y="726" font-family="Arial,sans-serif" font-size="18" fill="#55564f">An explanatory illustration. Not a product screenshot or performance benchmark.</text></svg>